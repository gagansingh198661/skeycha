<div class="catalog">
  <div class="catalog-controls">
    <div class="filter left">Filter</div>
    <div class="sort">Sort By
        <mat-icon  class="sort-by-icon">arrow_drop_down</mat-icon>
    </div>
  </div>
  <app-carousel
    [isMobile]="true"
    [images]="['/assets/carousel_item1.webp','/assets/carousel_item2.webp','/assets/carousel_item3.webp','/assets/carousel_item4.webp']"
    topLeft="Sale!"
    topRight="Limited Edition" [timerEnabled]="true">
  </app-carousel>
  

    


  <div class="catalog-products" (mousedown)="onMouseDown($event)"
   (mouseup)="onMouseUp($event)" 
   (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave($event)">
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="0"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="1"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="2"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="3"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="4"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="5"></app-product-card>
    <app-product-card class="product-card" [products]="slides" (click)="openProduct($event)"   [style.--customWidth]="cardWidth"; [style.--customHeight]="cardHeight"; [currentIndex]="6"></app-product-card>
    
  
  </div>
  <div class="catalog-pages">
    <div class="page-control" (click)="selectPreviousPage()">&lt;</div>
    @for (page of numberOfPages; track page) {
      <div class="page-number"
          (click)="selectPage(page)"
          [class.selected]="page === selectedPage">
        {{ page + 1 }}
      </div>
  }
    <div class="page-control" (click)="selectNextPage()">&gt;</div>

  </div>
</div>
