<div class="catalog">
  <div class="catalog-controls">
    <div class="filter left">Filter</div>
    <div class="sort">Sort By
        <mat-icon  class="sort-by-icon">arrow_drop_down</mat-icon>
    </div>
  </div>
  

    


  <div class="catalog-products">
    <app-product-card [products]="slides" (click)="openProduct()"></app-product-card>
    <app-product-card [products]="slides" (click)="openProduct()"></app-product-card>
    <app-product-card [products]="slides" (click)="openProduct()"></app-product-card>
    <app-product-card [products]="slides" (click)="openProduct()"></app-product-card>
    <app-product-card [products]="slides" (click)="openProduct()"></app-product-card>
    
    
    <!-- more products -->
  </div>
  <div class="catalog-pages">
    <div class="page-control" (click)="selectPreviousPage()">&lt;</div>
    @for (page of numberOfPages; track page) {
      <div class="page-number"
          (click)="selectPage(page)"
          [class.selected]="page === selectedPage">
        {{ page + 1 }}
      </div>
  }
    <div class="page-control" (click)="selectNextPage()">&gt;</div>

  </div>
</div>
