<div class="checkout-container" id="checkout-container">
    <div class="status" id="status" >
        <div class="options" style="display: 
        flex;flex-direction: row;">
            <div style="margin-right: 40%;margin-left: 10px;" (click)="toggleAddressInfo('contact')"><p>Contact</p></div>
            <div><p>></p></div>
        </div>
        <div class="options" style="display: flex;
        flex-direction: row;font-style: italic;">
            <div style="margin-right: 40%;margin-left: 10%;"><p>Address</p></div>
            <div><p>></p></div>
        </div>
        <div class="options" style="font-style: italic;">
            <div style="margin-left: 10%;"><p>Payment</p></div>
        </div>
    </div>

    <div id="order-summary" class="order-summary" >
        <div style="display: flex;flex-direction: row;justify-content: space-between;
        height: 50px;">
            <div style="margin-left: 10px;"><p>Order Summary</p></div>
            <div style="margin-right: 20px;"><p>10,958</p></div>
        </div>
        <hr style="margin-left: 10px;margin-right: 10px;"/>
        <div style="display: flex;flex-direction: row;justify-content: space-between;
        height: 50px;">
            <div style="margin-left: 10px;"><p>3 Total Items</p></div>
            <div style="margin-right: 20px;cursor:pointer;" (click)="toggleItems()">
                <p id="showItemsIcon" class="circle-plus">+</p>
            </div>
        </div>  
        
        <div class="order-items" [class.show]="showItems">
            <hr style="margin-left: 10px;margin-right: 10px;"/>
            @for(item of cartDtos; track item.id){
                <app-order-item [orderDto]="item" ></app-order-item>   
            }
        </div>
    </div>

    <div class="contact-info" id="contact-info">
        <div style="display: flex;flex-direction: column;justify-content: space-between;">
            <div style="margin-left: 10px;"><p>Contact Details</p></div>
            
            <div class="input-wrapper" >
                <input type="tel" id="phone" placeholder="Mobile Number" />
            </div>

            <div class="input-wrapper" >
                <input type="email" id="email" placeholder="Email Address" />
            </div>

            <button class="black-button" (click)="toggleAddressInfo('address')"
             style="margin-top: 20px;margin-bottom: 20px;">
             Continue
            </button>


            
        </div>

    </div>

    <div class="address-info" id="address-info" style="display: none;">
        <div style="display: flex;flex-direction: column;justify-content: space-between;">
            <div style="margin-left: 10px;">
                <p class="heading">Add delivery address</p>
            </div>
            
            <div class="input-wrapper" >
                <input type="text" id="fullname" placeholder="Full Name" />
            </div>

            <div class="input-wrapper" >
                <input type="text" id="address1" placeholder="House No/ Building /Apartment" />
            </div>
            <div class="input-wrapper" >
                <input type="text" id="address2" placeholder="Area, Sector, Street, Village" />
            </div>
            

            <div class="input-wrapper" >
                <input type="text" id="pincode" placeholder="Pin Code" />
            </div>
            <div class="input-wrapper-row" >
                <input type="text" id="city" placeholder="City" />
                <input type="text" id="state" placeholder="State" />
            </div>

            <button class="black-button" style="margin-top: 20px;margin-bottom: 20px;">Continue</button>
     
        </div>

    </div>


</div>
