<div class="login-page-container">
    <div class="login-page-container-inner">
        <div class="standard-margin" >
            <h1 class="title">
                Sign in
            </h1>
        </div>
        
        <section>
            <div class="standard-margin">
                <p>Sign in or create an account.</p>
            </div>
            <div class="continue">Continue with shop</div>
            <div style="margin-top: 20px;margin-bottom: 20px;">
                <div style="width: 100%;flex-direction: row;display: flex;">
                    <div style="width: 100%;padding-left: 5px;">
                        <hr style="color: black; ">
                    </div>
                    <p style="margin-block-start:0px;margin-block-end: 0px;">
                        or
                    </p>
                    <div style="width: 100%;padding-right: 5px;">
                        <hr style="color: black;">
                    </div>
                </div>
                    
                <div class="login-email-div" >
                    <input class="email-input" placeholder="Email" />
                    <button><mat-icon>arrow_forward</mat-icon></button>
                </div>

                <div class="terms&privacy standard-margin">
                    <section>
                        <div style="margin-top: 20px;">
                            <span style="color: #0000008F;">By continuing, you agree to our <span class="clickable" (click)="openTermsOfService()" >terms of service</span></span>
                        </div>
                        
                        <div style="align-items: center;text-align: center;margin-top: 50px;">Privacy Policy</div>
                    </section>
                </div>
                
            </div>
            
        </section>
        
    </div>
</div>
<app-terms-of-service [show]="showModal" (close)="showModal = false">
  <h2>Contact Info</h2>
  <p>Enter your details here...</p>
</app-terms-of-service>
