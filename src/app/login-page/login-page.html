<div class="modal" *ngIf="openLogin">
  <div class="modal-content">
    <span class="close" (click)="onClose()">&times;</span>
  
        <div class="login-page-container">
            <div class="login-page-container-inner">
                <div class="standard-margin login" >
                    <h1 class="title">
                        Login
                    </h1>
                </div>
                
                <section>
                    <div class="standard-margin email-div">
                        <p>Email</p>
                    </div>
                    <div class="login-email-div" >
                        <input class="email-input"/>
                    </div>


                    <div class="standard-margin email-div">
                        <p>Password</p>
                    </div>
                    <div class="login-password-div" >
                        <input class="email-input" type="password"/>
                    </div>
                    <div class="signInButton">Sign In</div>
                    <div style="margin-top: 20px;margin-bottom: 20px;">
                        <div style="width: 100%;flex-direction: row;display: flex;">
                            <div style="width: 100%;padding-left: 5px;">
                                <hr style="color: black; ">
                            </div>
                            <p style="margin-block-start:0px;margin-block-end: 0px;">
                                or
                            </p>
                            <div style="width: 100%;padding-right: 5px;">
                                <hr style="color: black;">
                            </div>
                        </div>
                            
                        
                        <div class="new-account standard-margin">
                            <section>
                                <div style="margin-top: 20px;" class="create-account">
                                    <span style="color: #0000008F;" class="clickable create-account-text">Create Account</span>
                                </div>
                                <div style="margin-top: 20px;" class="forgot-password">
                                    <span style="color: #0000008F;" class="clickable forgot-password-text">Forgot Password</span>
                                </div>
                            </section>
                        </div>
                        
                        
                    </div>
                    
                </section>
                
            </div>
        </div>
    </div>
</div>
