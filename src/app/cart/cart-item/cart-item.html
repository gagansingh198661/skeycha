<div class="cartItemContainer" style="padding-left: 15px;padding-right: 15px;">
    <div class="cart-tem-Image">
        <img src="{{cartDto?.productImgUrl}}" style="width: 100px; height: 100px;"/>
    </div>
    <div class="cart-item-description">
        <div>
            <h3>{{cartDto?.productName}}</h3>
        </div>
        <div>
            <p>{{cartDto?.productPrice}}</p>
        </div>
        <div >
            <p>{{cartDto?.productDescription}}</p>
        </div>
        <div>
            <div class="quantity-container row">
                <div class="quantity-inner-container">
                    <button class="quantity-button">+</button>
                    <span class="quantity">1</span>
                    <button class="quantity-button">−</button> <!-- U+2212 minus --> 
                </div>  
            </div>
        </div>
    </div>
</div>
<hr/>
