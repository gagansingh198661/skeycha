<app-carousel
  [isMobile]="true"
  [images]="['/assets/cup1.jpg','/assets/cup2.jpg','/assets/cup3.jpg']"
  topLeft="Sale!"
  topRight="Limited Edition">
</app-carousel>
<div class="product-details">
  <span class="brand">Skeycha</span>
  <h2 class="product-name">Skeycha Pearl Necklace</h2>
  <h2 class="product-badge">Authentic Tibetan Jewellery</h2>
  <div style="display: flex;">
    <div><span class="discounted-price">₹ 1,999</span></div>
    <div class="original-price"><span >₹ 2,499</span></div>
  </div>
  <div class="tax-included">Tax included. Shipping calculated at checkout</div>
  <div class="product-color-options row">
    <div style="display: block;">Color: White</div>
    <div class="colors column">
      <div class="color-option" style="background-image: url('assets/necklace_1.webp');"></div>
      <div class="color-option" style="background-image: url('assets/necklace_2.webp');"></div>
      
    </div>

  </div>
  <p></p>
</div>
