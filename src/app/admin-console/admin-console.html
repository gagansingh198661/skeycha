<div class="admin-container">
    <aside>
        Sidebar
    </aside>
    <main>
        <div>
            <form>
                <div class="input_container" id="input_container">
                    <div class="text_controls_container">
                        <label>Product Description : </label>
                        <input type ="text" id="product_description">
                        <label>Product Price : </label>
                        <input type ="text" id="product_price">
                        <label>Product Category : </label>
                        <select id="product_category">
                            <option >    </option>
                            <option value="Earring">Earrings</option>
                            <option value="Necklace">Necklace</option>
                            <option value="Ring">Rings</option>
                            <option value="Bag">Bags</option>
                        </select>
                    </div>
                    
                    <h3 >Upload A minimum of 3 Product Images</h3>
                    <ul class="files-list" id="files-list">
                        <li id="list_item_1">
                            <div style="display: flex;">
                                <input type="file" id="fileUpload_1" (change)="onFileChange($event)">
                                <img class="remove-button" id="cross_button_1"
                                class="removeImage" src="assets/cross-button.jpg" alt="Remove Image"
                                (click)="removeFile($event)">
                            </div>
                        </li>    
                    </ul>
                    
                    
                    
                    
                    
                    
                </div>
            </form>
            <button class="upload-button" (click)="addFn()">Add another Image</button>

        </div>
    </main>
</div>
